<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Rovix Applications</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: white; overflow-x: hidden; }
        
        .bg-grid { 
            position: fixed; inset: 0; z-index: -1; 
            background-image: linear-gradient(to right, #111 1px, transparent 1px), linear-gradient(to bottom, #111 1px, transparent 1px); 
            background-size: 40px 40px; 
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%); 
        }

        /* Dropdown padrão das fotos */
        .dropdown-menu { opacity: 0; transform: translateY(-10px); pointer-events: none; transition: all 0.2s ease; visibility: hidden; }
        .dropdown-menu.active { opacity: 1; transform: translateY(0); pointer-events: auto; visibility: visible; }
        
        /* Card de App - Estilo exato da foto */
        .bot-card { 
            background: #09090b; 
            border: 1px solid #18181b; 
            border-radius: 1rem; 
            transition: all 0.2s ease; 
        }
        .bot-card:hover { border-color: #27272a; background: #0c0c0e; }

        /* Botão roxo centralizado da foto */
        .btn-purple-cta {
            background: #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
            transition: all 0.2s ease;
        }
        .btn-purple-cta:hover { background: #9333ea; transform: scale(1.02); }
    </style>
    <link rel="icon" type="image/webp" href="/img/rovix-logo.webp">
</head>
<body class="min-h-screen flex flex-col">

    <div class="bg-grid"></div>

    <nav class="w-full border-b border-zinc-800 bg-zinc-950/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="/img/rovix-logo.webp" alt="Rovix Applications" style="width:22px;height:22px;object-fit:cover;border-radius:999px;">
                <span class="font-bold text-lg tracking-tight">Rovix <span class="text-[#a855f7]">Applications</span></span>
            </div>

            <div class="hidden md:flex gap-8 text-sm font-medium text-zinc-400">
                <a href="/" class="hover:text-white transition">Início</a>
                <a href="/planos" class="hover:text-white transition">Planos</a>
                <a href="/sobre" class="hover:text-white transition">Sobre</a>
                <a href="/status" class="hover:text-white transition border-b-2 border-transparent">Status</a>
            </div>

            <div class="relative auth-area">
                <button id="user-profile-btn" onclick="toggleMenu()" class="flex items-center gap-3 bg-zinc-900 border border-zinc-800 pr-4 pl-1 py-1 rounded-full hover:bg-zinc-800 transition">
                    <img id="user-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" class="w-8 h-8 rounded-full">
                    <span id="user-name" class="text-xs font-semibold text-white">Visitante</span>
                    <i class="fa-solid fa-chevron-down text-[10px] text-zinc-500"></i>
                </button>
                
                <div id="user-dropdown" class="dropdown-menu absolute right-0 mt-2 w-52 bg-[#09090b] border border-zinc-800 rounded-xl shadow-2xl p-1.5 z-50">
                    <a href="/dashboard" class="flex items-center gap-3 px-3 py-2 text-xs font-medium text-zinc-300 hover:text-white hover:bg-zinc-900 rounded-lg transition"><i class="fa-solid fa-layer-group w-4 text-zinc-500"></i> Minhas Aplicações</a>
                    <a href="/conta" class="flex items-center gap-3 px-3 py-2 text-xs font-medium text-zinc-300 hover:text-white hover:bg-zinc-900 rounded-lg transition"><i class="fa-solid fa-user-gear w-4 text-zinc-500"></i> Minha Conta</a>
                    <div class="h-px bg-zinc-800 my-1.5"></div>
                    <button onclick="logout()" class="w-full flex items-center gap-3 px-3 py-2 text-xs font-medium text-red-400 hover:bg-red-500/10 rounded-lg text-left transition"><i class="fa-solid fa-arrow-right-from-bracket w-4"></i> Sair</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto w-full p-8 md:p-12 flex-grow">
        <div class="mb-10">
            <h1 class="text-4xl font-extrabold tracking-tight uppercase">Suas <span class="text-[#a855f7]">Aplicações</span></h1>
            <p class="text-zinc-500 text-sm mt-1">Gerencie suas instâncias e serviços contratados.</p>
        </div>

        <div id="empty-state" class="hidden min-h-[450px] flex flex-col items-center justify-center border border-dashed border-zinc-800 rounded-[2.5rem] bg-zinc-900/10 relative overflow-hidden">
            <i class="fa-solid fa-box-open text-8xl opacity-[0.03] absolute"></i>
            <div class="relative z-10 flex flex-col items-center">
                <p class="text-zinc-500 mb-8 font-medium">Nenhum serviço ativo encontrado no momento.</p>
                <a href="/planos" class="btn-purple-cta text-white px-10 py-4 rounded-2xl font-bold text-sm flex items-center gap-3 uppercase tracking-tighter">
                    Ver Planos Disponíveis <i class="fa-solid fa-arrow-right text-xs"></i>
                </a>
            </div>
        </div>

        <div id="bots-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </main>

    <footer class="py-12 border-t border-zinc-900 bg-black text-center mt-auto">
        <p class="text-zinc-700 text-xs font-bold uppercase tracking-widest">© 2025 Rovix Applications • Premium Infrastructure</p>
    </footer>

    <script>
        const userJson = localStorage.getItem('zyper_user');
        if (!userJson) { window.location.href = '/login.html'; } 
        const user = JSON.parse(userJson);

        function toggleMenu() { document.getElementById('user-dropdown').classList.toggle('active'); }
        function logout() { localStorage.removeItem('zyper_user'); window.location.href = '/'; }

        async function carregarMeusBots() {
            const grid = document.getElementById('bots-grid');
            const empty = document.getElementById('empty-state');
            
            document.getElementById('user-name').innerText = user.username;
            document.getElementById('user-avatar').src = user.avatar || 'https://cdn.discordapp.com/embed/avatars/0.png';

            try {
                const userId = user.discordId || user.id;
                const userEmail = user.email || '';
                const res = await fetch(`/api/meus-bots?userId=${userId}&email=${userEmail}`);
                const bots = await res.json();

                if (!bots || bots.length === 0) { 
                    empty.classList.remove('hidden'); 
                } else {
                    bots.forEach(bot => {
                        const dataExp = new Date(bot.datas.expiraEm);
                        const hoje = new Date();
                        const dias = Math.ceil((dataExp - hoje) / (1000 * 60 * 60 * 24));
                        
                        grid.innerHTML += `
                            <div onclick="selecionarBot('${bot.squareCloudId}')" class="bot-card p-6 cursor-pointer group">
                                <div class="flex justify-between items-start mb-6">
                                    <div class="flex items-center gap-3">
                                        <img src="${bot.identidade?.avatar || 'https://cdn.discordapp.com/embed/avatars/0.png'}" class="w-11 h-11 rounded-xl border border-zinc-800">
                                        <div>
                                            <h3 class="font-bold text-white group-hover:text-[#a855f7] transition">${bot.identidade?.username || bot.produto.nome}</h3>
                                            <p class="text-[10px] text-zinc-500 font-mono">ID: ${bot.squareCloudId.slice(0, 10)}</p>
                                        </div>
                                    </div>
                                    <div class="w-2 h-2 rounded-full ${dias > 0 ? 'bg-emerald-500 shadow-[0_0_8px_#10b981]' : 'bg-red-500'}"></div>
                                </div>
                                <div class="text-xs text-zinc-500 py-3 border-t border-zinc-800 flex justify-between">
                                    <span>Expiração</span>
                                    <span class="font-bold text-zinc-200">${dias} dias</span>
                                </div>
                                <div class="mt-2 bg-zinc-900 border border-zinc-800 group-hover:bg-[#a855f7] group-hover:text-white group-hover:border-transparent transition-all py-2.5 rounded-lg text-center text-[10px] font-bold uppercase tracking-widest text-zinc-500">
                                    Gerenciar Aplicação
                                </div>
                            </div>`;
                    });
                }
            } catch (err) { console.error(err); empty.classList.remove('hidden'); }
        }

        function selecionarBot(id) { localStorage.setItem('bot_ativo_id', id); window.location.href = '/gerenciar'; }
        window.onclick = (e) => { if (!e.target.closest('.auth-area')) document.getElementById('user-dropdown').classList.remove('active'); }
        carregarMeusBots();
    </script>
    <script src="/js/site-guard.js"></script>
</body>
</html>
